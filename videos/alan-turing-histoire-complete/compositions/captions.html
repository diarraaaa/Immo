      <div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div class="cg" id="cg0"><span class="cl">En <span class="ca">1952,</span> la Grande-Bretagne condamne un homme qui l'a aidée à gagner la guerre.</span></div>
        <div class="cg" id="cg1"><span class="cl">Son crime ?</span></div>
        <div class="cg" id="cg2"><span class="cl">Avoir aimé un homme.</span></div>
        <div class="cg" id="cg3"><span class="cl"><span class="ca">61</span> ans plus tard, la reine lui accorde son pardon.</span></div>
        <div class="cg" id="cg4"><span class="cl">Entre les deux, il y a une machine secrète, un code réputé incassable, et une pomme à moitié mangée.</span></div>
        <div class="cg" id="cg5"><span class="cl">Il s'appelait Alan Turing.</span></div>
        <div class="cg" id="cg6"><span class="cl">Tu connais peut-être le film.</span></div>
        <div class="cg" id="cg7"><span class="cl">Tu connais peut-être Enigma.</span></div>
        <div class="cg" id="cg8"><span class="cl">Mais l'histoire complète est plus étrange.</span></div>
        <div class="cg" id="cg9"><span class="cl">Et plus dure.</span></div>
        <div class="cg" id="cg10"><span class="cl">Aujourd'hui, on la raconte du début.</span></div>
        <div class="cg" id="cg11"><span class="cl">Et à la fin, on reviendra sur cette pomme.</span></div>
        <div class="cg" id="cg12"><span class="cl">Parce que personne n'est d'accord sur ce qu'elle veut dire.</span></div>
        <div class="cg" id="cg13"><span class="cl">Londres, <span class="ca">23</span> juin <span class="ca">1912.</span></span></div>
        <div class="cg" id="cg14"><span class="cl">Alan Mathison Turing naît dans une famille de fonctionnaires de l'Empire britannique.</span></div>
        <div class="cg" id="cg15"><span class="cl">Son père travaille en Inde.</span></div>
        <div class="cg" id="cg16"><span class="cl">Alan et son frère grandissent souvent chez des familles d'accueil en Angleterre.</span></div>
        <div class="cg" id="cg17"><span class="cl">Très tôt, il est différent : passionné de chiffres et de chimie, indifférent au reste.</span></div>
        <div class="cg" id="cg18"><span class="cl">À l'école de Sherborne, un pensionnat chic du sud de l'Angleterre, on veut des latinistes.</span></div>
        <div class="cg" id="cg19"><span class="cl">Pas des scientifiques.</span></div>
        <div class="cg" id="cg20"><span class="cl">Son directeur écrit qu'il perd son temps dans une école comme la leur.</span></div>
        <div class="cg" id="cg21"><span class="cl">Alan est seul.</span></div>
        <div class="cg" id="cg22"><span class="cl">Jusqu'à Christopher Morcom.</span></div>
        <div class="cg" id="cg23"><span class="cl">Un élève un peu plus âgé, brillant, passionné d'astronomie.</span></div>
        <div class="cg" id="cg24"><span class="cl">Pour la première fois, quelqu'un parle sa langue.</span></div>
        <div class="cg" id="cg25"><span class="cl">Alan l'admire.</span></div>
        <div class="cg" id="cg26"><span class="cl">Il l'aime, sans doute.</span></div>
        <div class="cg" id="cg27"><span class="cl">Le <span class="ca">13</span> février <span class="ca">1930,</span> Christopher meurt de la tuberculose.</span></div>
        <div class="cg" id="cg28"><span class="cl">Il a <span class="ca">18</span> ans.</span></div>
        <div class="cg" id="cg29"><span class="cl">Alan est dévasté.</span></div>
        <div class="cg" id="cg30"><span class="cl">Et il se pose une question qui ne le lâchera plus : qu'est-ce qu'un esprit ?</span></div>
        <div class="cg" id="cg31"><span class="cl">Est-ce que la pensée peut exister en dehors du corps ?</span></div>
        <div class="cg" id="cg32"><span class="cl">Garde cette question en tête.</span></div>
        <div class="cg" id="cg33"><span class="cl">Elle va revenir.</span></div>
        <div class="cg" id="cg34"><span class="cl">En <span class="ca">1931,</span> Turing entre au King's College de Cambridge.</span></div>
        <div class="cg" id="cg35"><span class="cl">Il y étudie les mathématiques.</span></div>
        <div class="cg" id="cg36"><span class="cl">À <span class="ca">22</span> ans, il devient membre du collège, un honneur rare.</span></div>
        <div class="cg" id="cg37"><span class="cl">Et en <span class="ca">1936,</span> il publie un article au titre aride : « Sur les nombres calculables ».</span></div>
        <div class="cg" id="cg38"><span class="cl">À l'intérieur, une idée folle.</span></div>
        <div class="cg" id="cg39"><span class="cl">Il imagine une machine.</span></div>
        <div class="cg" id="cg40"><span class="cl">Pas en métal.</span></div>
        <div class="cg" id="cg41"><span class="cl">Une machine sur le papier.</span></div>
        <div class="cg" id="cg42"><span class="cl">Un ruban infini, une tête qui lit, écrit, efface un symbole, et avance d'une case.</span></div>
        <div class="cg" id="cg43"><span class="cl">C'est tout.</span></div>
        <div class="cg" id="cg44"><span class="cl">Et Turing démontre qu'une seule machine de ce type, si on lui donne les bonnes instructions, peut imiter n'importe quelle autre.</span></div>
        <div class="cg" id="cg45"><span class="cl">Une machine universelle.</span></div>
        <div class="cg" id="cg46"><span class="cl">Relis cette phrase.</span></div>
        <div class="cg" id="cg47"><span class="cl">C'est l'idée de l'ordinateur.</span></div>
        <div class="cg" id="cg48"><span class="cl">Un seul appareil, et des programmes différents.</span></div>
        <div class="cg" id="cg49"><span class="cl">Plus de dix ans avant que le premier ordinateur de ce type fonctionne.</span></div>
        <div class="cg" id="cg50"><span class="cl">Turing part ensuite à Princeton, aux États-Unis.</span></div>
        <div class="cg" id="cg51"><span class="cl">Il y prépare un doctorat sous la direction du logicien Alonzo Church.</span></div>
        <div class="cg" id="cg52"><span class="cl">Il rentre en Angleterre en <span class="ca">1938.</span></span></div>
        <div class="cg" id="cg53"><span class="cl">Juste à temps.</span></div>
        <div class="cg" id="cg54"><span class="cl">Septembre <span class="ca">1939.</span></span></div>
        <div class="cg" id="cg55"><span class="cl">La guerre éclate.</span></div>
        <div class="cg" id="cg56"><span class="cl">Turing rejoint un manoir discret au nord de Londres : Bletchley Park.</span></div>
        <div class="cg" id="cg57"><span class="cl">C'est le centre secret des décrypteurs britanniques.</span></div>
        <div class="cg" id="cg58"><span class="cl">Leur ennemi s'appelle Enigma.</span></div>
        <div class="cg" id="cg59"><span class="cl">La machine de chiffrement de l'armée allemande.</span></div>
        <div class="cg" id="cg60"><span class="cl">Des rotors, des fiches, des réglages qui changent chaque jour.</span></div>
        <div class="cg" id="cg61"><span class="cl">Le nombre de combinaisons possibles se compte en milliards de milliards.</span></div>
        <div class="cg" id="cg62"><span class="cl">Mais il faut rendre justice à quelqu'un.</span></div>
        <div class="cg" id="cg63"><span class="cl">Les premiers à avoir cassé Enigma, ce ne sont pas les Britanniques.</span></div>
        <div class="cg" id="cg64"><span class="cl">Ce sont des mathématiciens polonais, menés par Marian Rejewski, dès les années <span class="ca">1930.</span></span></div>
        <div class="cg" id="cg65"><span class="cl">En juillet <span class="ca">1939,</span> dans une forêt près de Varsovie, ils transmettent tout leur travail aux Britanniques et aux Français.</span></div>
        <div class="cg" id="cg66"><span class="cl">Turing part de là.</span></div>
        <div class="cg" id="cg67"><span class="cl">Avec Gordon Welchman, il conçoit une machine bien plus puissante : la Bombe.</span></div>
        <div class="cg" id="cg68"><span class="cl">Une armoire bruyante, pleine de tambours qui tournent, et qui élimine les mauvais réglages à toute vitesse.</span></div>
        <div class="cg" id="cg69"><span class="cl">La première est installée en mars <span class="ca">1940.</span></span></div>
        <div class="cg" id="cg70"><span class="cl">Turing prend ensuite la tête du Hut <span class="ca">8,</span> la baraque chargée du code de la marine allemande.</span></div>
        <div class="cg" id="cg71"><span class="cl">Le plus dur de tous.</span></div>
        <div class="cg" id="cg72"><span class="cl">Ce code protège les sous-marins qui coulent les convois de l'Atlantique.</span></div>
        <div class="cg" id="cg73"><span class="cl">Ces convois transportent la nourriture et les armes dont la Grande-Bretagne a besoin pour tenir.</span></div>
        <div class="cg" id="cg74"><span class="cl">En <span class="ca">1941,</span> les décrypteurs commencent à lire les messages de la marine.</span></div>
        <div class="cg" id="cg75"><span class="cl">Mais ils manquent de tout.</span></div>
        <div class="cg" id="cg76"><span class="cl">De personnel.</span></div>
        <div class="cg" id="cg77"><span class="cl">De machines.</span></div>
        <div class="cg" id="cg78"><span class="cl">Alors, en octobre <span class="ca">1941,</span> Turing et trois collègues font quelque chose d'inouï.</span></div>
        <div class="cg" id="cg79"><span class="cl">Ils écrivent directement à Winston Churchill.</span></div>
        <div class="cg" id="cg80"><span class="cl">Sans passer par leurs chefs.</span></div>
        <div class="cg" id="cg81"><span class="cl">La réponse de Churchill tient en une étiquette rouge : « Action ce jour ».</span></div>
        <div class="cg" id="cg82"><span class="cl">Ils obtiennent ce qu'ils demandent.</span></div>
        <div class="cg" id="cg83"><span class="cl">Combien de vies ce travail a-t-il sauvées ?</span></div>
        <div class="cg" id="cg84"><span class="cl">Personne ne peut le chiffrer.</span></div>
        <div class="cg" id="cg85"><span class="cl">Selon Bletchley Park, il aurait raccourci la guerre de jusqu'à <span class="ca">2</span> ans.</span></div>
        <div class="cg" id="cg86"><span class="cl">C'est une estimation, et elle est débattue.</span></div>
        <div class="cg" id="cg87"><span class="cl">Mais une chose est sûre : pendant des décennies, presque personne n'a su ce que Turing avait fait.</span></div>
        <div class="cg" id="cg88"><span class="cl">Tout était classé secret.</span></div>
        <div class="cg" id="cg89"><span class="cl">Après la guerre, il reçoit une décoration, l'OBE.</span></div>
        <div class="cg" id="cg90"><span class="cl">Discrètement.</span></div>
        <div class="cg" id="cg91"><span class="cl">Puis il revient à son obsession : construire sa machine universelle pour de vrai.</span></div>
        <div class="cg" id="cg92"><span class="cl">Au Laboratoire national de physique, il dessine les plans d'un ordinateur, l'ACE.</span></div>
        <div class="cg" id="cg93"><span class="cl">En <span class="ca">1948,</span> il rejoint l'université de Manchester, où tourne l'un des premiers ordinateurs au monde.</span></div>
        <div class="cg" id="cg94"><span class="cl">Il écrit des programmes.</span></div>
        <div class="cg" id="cg95"><span class="cl">Et en <span class="ca">1950,</span> il publie un article qui commence par une question simple : les machines peuvent-elles penser ?</span></div>
        <div class="cg" id="cg96"><span class="cl">Plutôt que de se battre sur les mots, il propose un jeu.</span></div>
        <div class="cg" id="cg97"><span class="cl">Un humain discute par écrit avec un interlocuteur caché.</span></div>
        <div class="cg" id="cg98"><span class="cl">Si l'humain ne peut pas dire s'il parle à une personne ou à une machine, alors la machine a réussi.</span></div>
        <div class="cg" id="cg99"><span class="cl">On l'appelle aujourd'hui le test de Turing.</span></div>
        <div class="cg" id="cg100"><span class="cl">Tu te souviens de Christopher, et de la question sur l'esprit ?</span></div>
        <div class="cg" id="cg101"><span class="cl">La voilà, <span class="ca">20</span> ans plus tard.</span></div>
        <div class="cg" id="cg102"><span class="cl">En <span class="ca">1951,</span> Turing entre à la Royal Society, l'une des plus prestigieuses académies scientifiques du monde.</span></div>
        <div class="cg" id="cg103"><span class="cl">Il a <span class="ca">39</span> ans.</span></div>
        <div class="cg" id="cg104"><span class="cl">Il est au sommet.</span></div>
        <div class="cg" id="cg105"><span class="cl">Janvier <span class="ca">1952.</span></span></div>
        <div class="cg" id="cg106"><span class="cl">Sa maison, près de Manchester, est cambriolée.</span></div>
        <div class="cg" id="cg107"><span class="cl">Turing porte plainte.</span></div>
        <div class="cg" id="cg108"><span class="cl">Pendant l'enquête, il explique à la police qu'il a une relation avec un jeune homme, Arnold Murray, et que le cambrioleur est une connaissance de Murray.</span></div>
        <div class="cg" id="cg109"><span class="cl">Il ne cache rien.</span></div>
        <div class="cg" id="cg110"><span class="cl">Il ne pense pas avoir fait quelque chose de mal.</span></div>
        <div class="cg" id="cg111"><span class="cl">Mais en Grande-Bretagne, à cette époque, l'homosexualité masculine est un crime.</span></div>
        <div class="cg" id="cg112"><span class="cl">La victime du cambriolage devient l'accusé.</span></div>
        <div class="cg" id="cg113"><span class="cl">Le <span class="ca">31</span> mars <span class="ca">1952,</span> Turing est reconnu coupable de « grossière indécence ».</span></div>
        <div class="cg" id="cg114"><span class="cl">Le juge lui laisse un choix.</span></div>
        <div class="cg" id="cg115"><span class="cl">La prison.</span></div>
        <div class="cg" id="cg116"><span class="cl">Ou un an de mise à l'épreuve, avec un traitement hormonal destiné à supprimer sa libido.</span></div>
        <div class="cg" id="cg117"><span class="cl">Ce qu'on appellera plus tard une castration chimique.</span></div>
        <div class="cg" id="cg118"><span class="cl">Turing choisit le traitement, pour pouvoir continuer à travailler.</span></div>
        <div class="cg" id="cg119"><span class="cl">Son corps change.</span></div>
        <div class="cg" id="cg120"><span class="cl">Et il perd son habilitation de sécurité.</span></div>
        <div class="cg" id="cg121"><span class="cl">L'homme qui avait cassé les codes de l'ennemi ne peut plus travailler pour les services secrets de son pays.</span></div>
        <div class="cg" id="cg122"><span class="cl">En pleine guerre froide, on le considère comme un risque.</span></div>
        <div class="cg" id="cg123"><span class="cl">Le <span class="ca">8</span> juin <span class="ca">1954,</span> sa femme de ménage le trouve mort dans son lit.</span></div>
        <div class="cg" id="cg124"><span class="cl">Il avait <span class="ca">41</span> ans.</span></div>
        <div class="cg" id="cg125"><span class="cl">Il est mort la veille, empoisonné au cyanure.</span></div>
        <div class="cg" id="cg126"><span class="cl">À côté de lui, une pomme à moitié mangée.</span></div>
        <div class="cg" id="cg127"><span class="cl">L'enquête officielle conclut au suicide.</span></div>
        <div class="cg" id="cg128"><span class="cl">C'est la version que la plupart des livres retiennent.</span></div>
        <div class="cg" id="cg129"><span class="cl">Mais elle n'a jamais convaincu tout le monde.</span></div>
        <div class="cg" id="cg130"><span class="cl">Sa mère pensait à un accident.</span></div>
        <div class="cg" id="cg131"><span class="cl">Turing faisait des expériences de chimie chez lui, avec du cyanure.</span></div>
        <div class="cg" id="cg132"><span class="cl">Et la pomme, elle, n'a jamais été analysée.</span></div>
        <div class="cg" id="cg133"><span class="cl">L'historien Jack Copeland, spécialiste de Turing, estime que l'accident est possible et que les preuves sont plus faibles qu'on ne le dit.</span></div>
        <div class="cg" id="cg134"><span class="cl">On ne saura sans doute jamais.</span></div>
        <div class="cg" id="cg135"><span class="cl">Ce que l'on sait, c'est que les deux dernières années de sa vie ont été brisées par une condamnation injuste.</span></div>
        <div class="cg" id="cg136"><span class="cl">Il faudra des décennies pour que le pays regarde cette histoire en face.</span></div>
        <div class="cg" id="cg137"><span class="cl">En <span class="ca">2009,</span> après une pétition, le Premier ministre Gordon Brown présente des excuses officielles au nom du gouvernement.</span></div>
        <div class="cg" id="cg138"><span class="cl">Le <span class="ca">24</span> décembre <span class="ca">2013,</span> la reine Élisabeth II accorde à Alan Turing un pardon royal.</span></div>
        <div class="cg" id="cg139"><span class="cl"><span class="ca">61</span> ans après sa condamnation.</span></div>
        <div class="cg" id="cg140"><span class="cl">En <span class="ca">2017,</span> une loi surnommée « loi Alan Turing » étend ce pardon à des milliers d'hommes condamnés pour les mêmes raisons.</span></div>
        <div class="cg" id="cg141"><span class="cl">Et le <span class="ca">23</span> juin <span class="ca">2021,</span> le jour de son anniversaire, la Banque d'Angleterre met en circulation un nouveau billet de <span class="ca">50</span> livres.</span></div>
        <div class="cg" id="cg142"><span class="cl">Avec son visage.</span></div>
        <div class="cg" id="cg143"><span class="cl">Alan Turing a imaginé l'ordinateur avant qu'il existe.</span></div>
        <div class="cg" id="cg144"><span class="cl">Il a aidé à casser le code d'Enigma.</span></div>
        <div class="cg" id="cg145"><span class="cl">Il a posé la question qui obsède encore les chercheurs en intelligence artificielle.</span></div>
        <div class="cg" id="cg146"><span class="cl">Et son pays l'a condamné pour qui il aimait.</span></div>
        <div class="cg" id="cg147"><span class="cl">Le pardon est arrivé.</span></div>
        <div class="cg" id="cg148"><span class="cl">Mais il n'a jamais pu l'entendre.</span></div>
        <div class="cg cq" id="cg149"><span class="cl">Tu connaissais cette partie de son histoire ?</span></div>
      </div>
