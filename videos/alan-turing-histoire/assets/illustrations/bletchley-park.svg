<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <!-- Illustration du manoir de Bletchley Park (vue stylisée). -->
  <defs>
    <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#e85d26"/></pattern>
    <pattern id="win" width="46" height="62" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="22" height="34" fill="#111111"/>
      <rect x="20" y="12" width="2" height="34" fill="#1a1a18"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="#1a1a18"/>
  <!-- ciel : lune -->
  <circle cx="720" cy="110" r="54" fill="url(#d)"/>
  <!-- arbres -->
  <path d="M0 420 C30 300 90 290 120 340 C150 260 230 280 230 420 Z" fill="#111111"/>
  <path d="M720 420 C740 300 810 280 840 330 C860 290 900 300 900 340 L900 420 Z" fill="#111111"/>
  <!-- corps principal -->
  <path d="M150 420 L150 250 L230 250 L230 210 L270 170 L310 210 L310 250 L420 250 L420 190 L470 130 L520 190 L520 250 L610 250 L610 215 L650 180 L690 215 L690 420 Z" fill="#f0ece5"/>
  <!-- tourelle -->
  <rect x="452" y="96" width="36" height="40" fill="#f0ece5"/>
  <path d="M446 98 L470 60 L494 98 Z" fill="#e85d26"/>
  <!-- fenêtres -->
  <rect x="160" y="270" width="140" height="130" fill="url(#win)"/>
  <rect x="320" y="270" width="92" height="130" fill="url(#win)"/>
  <rect x="430" y="200" width="80" height="200" fill="url(#win)"/>
  <rect x="528" y="270" width="150" height="130" fill="url(#win)"/>
  <!-- porte -->
  <path d="M452 420 L452 360 C452 340 488 340 488 360 L488 420 Z" fill="#e85d26"/>
  <!-- sol -->
  <rect y="420" width="900" height="140" fill="#111111"/>
  <rect y="420" width="900" height="3" fill="#e85d26"/>
  <rect x="0.5" y="0.5" width="899" height="559" fill="none" stroke="#282826"/>
</svg>
