<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720">
  <!-- Illustration stylisée (silhouette), pas une photo. Remplaçable par une vraie photo d'archive. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#e85d26"/>
    </pattern>
    <pattern id="dotsFine" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#e85d26" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a18" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a1a18" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="#1a1a18"/>
  <rect width="600" height="720" fill="url(#dotsFine)"/>
  <!-- buste -->
  <path d="M30 720 C40 600 120 548 230 530 L370 530 C480 548 560 600 570 720 Z" fill="#111111"/>
  <path d="M30 720 C40 600 120 548 230 530 L370 530 C480 548 560 600 570 720 Z" fill="url(#dots)" opacity="0.55"/>
  <!-- revers de veste -->
  <path d="M230 530 L300 650 L262 720 L180 720 L205 560 Z" fill="#111111"/>
  <path d="M370 530 L300 650 L338 720 L420 720 L395 560 Z" fill="#111111"/>
  <!-- chemise + cravate -->
  <path d="M250 528 L300 640 L350 528 Z" fill="#f0ece5"/>
  <path d="M288 560 L312 560 L320 660 L300 690 L280 660 Z" fill="#111111"/>
  <!-- cou -->
  <path d="M258 440 L342 440 L350 540 L300 575 L250 540 Z" fill="#e85d26"/>
  <!-- tête -->
  <ellipse cx="300" cy="330" rx="118" ry="148" fill="#e85d26"/>
  <ellipse cx="300" cy="330" rx="118" ry="148" fill="url(#dots)" opacity="0.35"/>
  <!-- ombre côté visage -->
  <path d="M352 200 C430 260 430 420 330 476 C392 400 400 280 352 200 Z" fill="#111111" opacity="0.35"/>
  <!-- oreilles -->
  <ellipse cx="183" cy="345" rx="18" ry="34" fill="#e85d26"/>
  <ellipse cx="417" cy="345" rx="18" ry="34" fill="#c94d1d"/>
  <!-- cheveux, raie sur le côté -->
  <path d="M180 300 C170 190 240 150 310 152 C390 154 440 200 424 300 C410 250 380 228 330 222 C300 236 250 236 214 226 C196 246 188 270 180 300 Z" fill="#111111"/>
  <path d="M214 226 C250 212 290 206 330 222 C300 214 262 214 214 226 Z" fill="#f0ece5" opacity="0.18"/>
  <rect width="600" height="720" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="599" height="719" fill="none" stroke="#282826"/>
</svg>
