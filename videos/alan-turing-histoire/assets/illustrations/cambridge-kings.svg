<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <!-- Illustration stylisée : chapelle du King's College, Cambridge, au bord de la Cam. -->
  <defs>
    <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#e85d26"/></pattern>
    <pattern id="v" width="46" height="150" patternUnits="userSpaceOnUse">
      <path d="M12 140 L12 30 C12 14 34 14 34 30 L34 140 Z" fill="#111111"/>
      <rect x="22" y="24" width="2" height="116" fill="#1a1a18"/>
    </pattern>
  </defs>
  <rect width="900" height="320" fill="#1a1a18"/>
  <circle cx="770" cy="70" r="44" fill="url(#d)"/>
  <!-- arbres -->
  <path d="M0 240 C20 150 80 140 110 190 C130 150 170 160 180 240 Z" fill="#111111"/>
  <!-- nef de la chapelle -->
  <rect x="210" y="110" width="480" height="130" fill="#f0ece5"/>
  <rect x="226" y="90" width="448" height="22" fill="#f0ece5"/>
  <rect x="232" y="110" width="436" height="122" fill="url(#v)"/>
  <!-- tourelles d'angle -->
  <g fill="#f0ece5">
    <rect x="190" y="70" width="34" height="170"/><path d="M190 70 L207 30 L224 70 Z"/>
    <rect x="676" y="70" width="34" height="170"/><path d="M676 70 L693 30 L710 70 Z"/>
  </g>
  <g fill="#e85d26"><rect x="203" y="14" width="8" height="20"/><rect x="689" y="14" width="8" height="20"/></g>
  <!-- pinacles -->
  <g fill="#f0ece5">
    <path d="M300 90 L306 66 L312 90 Z"/><path d="M392 90 L398 66 L404 90 Z"/><path d="M484 90 L490 66 L496 90 Z"/><path d="M576 90 L582 66 L588 90 Z"/>
  </g>
  <!-- pelouse et rivière -->
  <rect y="240" width="900" height="80" fill="#111111"/>
  <rect y="240" width="900" height="3" fill="#e85d26"/>
  <!-- barque (punt) -->
  <path d="M600 284 L760 284 L748 296 L612 296 Z" fill="#e85d26"/>
  <line x1="700" y1="284" x2="730" y2="232" stroke="#f0ece5" stroke-width="3"/>
  <g fill="#505048"><rect x="80" y="270" width="140" height="3"/><rect x="320" y="300" width="180" height="3"/></g>
  <rect x="0.5" y="0.5" width="899" height="319" fill="none" stroke="#282826"/>
</svg>
