<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <!-- Illustration stylisée : Westminster et Big Ben au bord de la Tamise (Londres, 1912). -->
  <defs>
    <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#e85d26"/></pattern>
    <pattern id="w" width="30" height="40" patternUnits="userSpaceOnUse"><rect x="9" y="8" width="12" height="24" fill="#111111"/></pattern>
  </defs>
  <rect width="900" height="420" fill="#1a1a18"/>
  <!-- soleil voilé -->
  <circle cx="160" cy="120" r="70" fill="url(#d)"/>
  <!-- brume -->
  <rect x="0" y="150" width="900" height="6" fill="#282826"/>
  <rect x="80" y="178" width="820" height="4" fill="#282826"/>
  <!-- parlement -->
  <path d="M300 320 L300 230 L330 230 L330 205 L345 190 L360 205 L360 230 L420 230 L420 215 L440 200 L460 215 L460 230 L520 230 L520 205 L535 190 L550 205 L550 230 L600 230 L600 180 L612 160 L624 180 L624 230 L680 230 L680 210 L700 195 L720 210 L720 230 L860 230 L860 320 Z" fill="#f0ece5"/>
  <rect x="310" y="250" width="540" height="56" fill="url(#w)"/>
  <!-- tour de l'horloge (Big Ben) -->
  <rect x="200" y="110" width="70" height="210" fill="#f0ece5"/>
  <rect x="192" y="96" width="86" height="22" fill="#f0ece5"/>
  <path d="M200 96 L235 30 L270 96 Z" fill="#f0ece5"/>
  <rect x="231" y="10" width="8" height="24" fill="#f0ece5"/>
  <circle cx="235" cy="150" r="26" fill="#e85d26"/>
  <circle cx="235" cy="150" r="26" fill="none" stroke="#111111" stroke-width="4"/>
  <line x1="235" y1="150" x2="235" y2="132" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="235" y1="150" x2="249" y2="156" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <rect x="212" y="190" width="46" height="110" fill="url(#w)"/>
  <!-- Tamise -->
  <rect y="320" width="900" height="100" fill="#111111"/>
  <rect y="320" width="900" height="3" fill="#e85d26"/>
  <g fill="#505048">
    <rect x="60" y="350" width="120" height="3"/><rect x="260" y="372" width="200" height="3"/>
    <rect x="540" y="346" width="140" height="3"/><rect x="720" y="388" width="120" height="3"/>
  </g>
  <!-- reflet de l'horloge -->
  <rect x="220" y="332" width="30" height="4" fill="#e85d26" opacity="0.6"/>
  <rect x="226" y="344" width="18" height="3" fill="#e85d26" opacity="0.4"/>
  <rect x="0.5" y="0.5" width="899" height="419" fill="none" stroke="#282826"/>
</svg>
